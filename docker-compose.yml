# Local development only: Postgres 17 with the pgvector extension built in.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: injury
      POSTGRES_PASSWORD: injury
      POSTGRES_DB: injury_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U injury -d injury_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
