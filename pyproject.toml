[project]
name = "injury-semantic-search"
version = "0.1.0"
description = "Search injury notes by meaning: LLM extraction, embeddings and semantic search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true