name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres + pgvector for the database tests, like docker compose locally.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: injury
          POSTGRES_PASSWORD: injury
          POSTGRES_DB: injury_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U injury -d injury_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://injury:injury@localhost:5432/injury_ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run mypy app tests
